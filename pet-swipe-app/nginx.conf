# Раздаёт статику фронтенда и проксирует /api на бэкенд —
# браузер видит один origin, поэтому CORS и адрес API в коде не нужны.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;   # фото питомцев до 5 МБ + запас на multipart

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
